{% extends "dash_base.html" %}
{% set section = 'a-users' %}
{% block title %}Create account{% endblock %}
{% block content %}
<header class="dash-head"><h1>Create account</h1></header>
<form method="post" class="form panel form-narrow" novalidate>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="field"><label for="role">Role</label>
    <select class="input" id="role" name="role">
      {% for r, d in [('buyer', 'Buyer'), ('farmer', 'Farmer (active immediately)'), ('admin', 'Admin (full access)')] %}<option value="{{ r }}" {{ 'selected' if form.get('role') == r }}>{{ d }}</option>{% endfor %}
    </select></div>
  <div class="field"><label for="name">Full name</label><input class="input" id="name" name="name" value="{{ form.get('name', '') }}" required></div>
  <div class="row">
    <div class="field"><label for="username">Username</label><input class="input" id="username" name="username" value="{{ form.get('username', '') }}" required></div>
    <div class="field"><label for="password">Password (6+ characters)</label><input class="input" id="password" name="password" type="password" autocomplete="new-password" required></div>
  </div>
  <div class="row">
    <div class="field"><label for="phone">Phone</label><input class="input" id="phone" name="phone" value="{{ form.get('phone', '') }}"></div>
    <div class="field"><label for="village">Village or city</label><input class="input" id="village" name="village" value="{{ form.get('village', '') }}"></div>
  </div>
  <div class="form-actions"><button class="btn btn-primary">Create account</button><a class="btn btn-ghost" href="{{ url_for('admin_users') }}">Cancel</a></div>
</form>
{% endblock %}
