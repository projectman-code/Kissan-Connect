{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<section class="auth">
  <div class="wrap auth-narrow">
    <div class="auth-card center">
      <p class="err-code">{{ code }}</p>
      <h1>{{ title }}</h1>
      <p class="muted">{{ msg }}</p>
      <p><a class="btn btn-primary" href="{{ url_for('landing') }}">Go to the home page</a></p>
    </div>
  </div>
</section>
{% endblock %}
